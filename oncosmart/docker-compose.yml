# Local / demo deployment. Secrets come from the environment or a .env file — never commit real values.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oncosmart
      POSTGRES_USER: oncosmart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oncosmart -d oncosmart"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://oncosmart:${POSTGRES_PASSWORD}@db:5432/oncosmart
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (openssl rand -hex 48)}
      DEMO_MODE: ${DEMO_MODE:-true}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-Demo@2026}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MESSAGING_PROVIDER: ${MESSAGING_PROVIDER:-mock}
    ports:
      - "4000:4000"
volumes:
  pgdata:
